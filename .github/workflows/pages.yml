name: Check and publish Neon Swarm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check syntax and game rules
        run: |
          node --check characters.js
          node --check core.js
          node --check game.js
          node --check curriculum.js
          node --check learning.js
          node --check section-catalog.js
          for chapter in content/*.js; do node --check "$chapter"; done
          node --test tests/*.test.js
      - name: Prepare the static game
        run: |
          mkdir -p _site
          cp index.html character-gallery.html style.css core.js curriculum.js section-catalog.js learning.js characters.js game.js LICENSE.md ASSETS.md RODIN-ASSET-PLAN.md BALANCE.md CONTENT.md COVERAGE.md QUESTION-REVIEW.md question-review.json coverage.json .nojekyll _site/
          cp -r assets vendor content _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
